<div class="menu-mobile">
    <nav>
        <ul>
            <li (click)="service.scrollToElement('top')">
                <span class="menu-link" [class.activeLink]="service.activeLink() === 'top'" translate>Home</span>
            </li>
            <li (click)="service.scrollToElement('about')">
                <span class="menu-link" [class.activeLink]="service.activeLink() === 'about'" translate>About me</span>
            </li>
            <li (click)="service.scrollToElement('skills')">
                <span class="menu-link" [class.activeLink]="service.activeLink() === 'skills'" translate>Skills</span>
            </li>
            <li (click)="service.scrollToElement('portfolio')">
                <span class="menu-link" [class.activeLink]="service.activeLink() === 'portfolio'" translate>Portfolio</span>
            </li>
            <li (click)="service.scrollToElement('contact')">
                <span class="menu-link" [class.activeLink]="service.activeLink() === 'contact'" translate>Contact</span>
            </li>
            <li (click)="service.openLegalPage()">
                <span class="menu-link" [class.activeLink]="service.activeLink() === 'legal'" translate>Legal notice</span>
            </li>
        </ul>
    </nav>
    <div class="langBox">
        <span (click)="changeLanguage('en')" class="lang" [class.activeLanguage]="service.langEnglish()">EN</span>
        <span>|</span>
        <span (click)="changeLanguage('de')" class="lang" [class.activeLanguage]="!service.langEnglish()">DE</span>
    </div>
</div>
